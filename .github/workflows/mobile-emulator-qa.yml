name: Flutter mobile emulator gameplay QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android emulator real-app gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: flutter test integration_test/color_match_demo_test.dart -d emulator-5554

  ios-simulator:
    name: iOS simulator real-app gameplay
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available | sed -nE 's/.*iPhone.*\(([0-9A-Fa-f-]{36})\).*/\1/p' | head -n 1)
          if [ -z "$simulator_id" ]; then
            echo "No iPhone simulator installed"
            exit 1
          fi
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run Color Match on the simulator
        shell: bash
        run: flutter test integration_test/color_match_demo_test.dart -d "${{ steps.simulator.outputs.id }}"
