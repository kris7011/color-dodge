name: Flutter mobile emulator gameplay QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android emulator real-app gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: flutter test integration_test/color_match_demo_test.dart -d emulator-5554

  ios-simulator:
    name: iOS simulator real-app gameplay
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available | sed -nE 's/.*iPhone.*\(([0-9A-Fa-f-]{36})\).*/\1/p' | head -n 1)
          if [ -z "$simulator_id" ]; then
            echo "No iPhone simulator installed"
            exit 1
          fi
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Verify Flutter and iOS toolchain
        run: |
          flutter --version
          xcodebuild -version
          flutter devices
      - name: Run Color Match on the simulator
        shell: bash
        env:
          IOS_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 -u - <<'PY'
          import os
          import subprocess
          import sys

          command = [
              "flutter",
              "test",
              "--no-pub",
              "--reporter",
              "expanded",
              "integration_test/mobile_smoke_test.dart",
              "-d",
              os.environ["IOS_SIMULATOR_ID"],
          ]
          print("Running the real iOS simulator integration test", flush=True)
          try:
              subprocess.run(command, check=True, timeout=900)
          except subprocess.TimeoutExpired:
              print("Integration test exceeded 15 minutes; preserving failed CI", flush=True)
              sys.exit(124)
          PY
      - name: Collect simulator diagnostics after a failed smoke test
        if: failure()
        shell: bash
        env:
          IOS_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl list devices booted
          xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 3m --style compact --predicate 'process == "Runner" || process == "SpringBoard"' | tail -n 180 || true
