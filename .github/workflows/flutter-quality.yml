name: Flutter quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analysis and widget tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Ensure dependencies match the committed lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded
